<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>:root{--paper:oklch(99% .003 100);--ink:oklch(18% .006 250);--muted:oklch(45% .008 250);--rule:oklch(78% .008 250);--link:oklch(45% .16 255)}text{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}</style><rect width="1200" height="720" fill="var(--paper)"/><rect width="170" height="720" fill="oklch(97% .006 100)"/><circle cx="85" cy="68" r="42" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="serif" x="62" y="83" font-size="42" fill="var(--ink)">W</text><text x="40" y="142" font-size="16" fill="var(--ink)">Contents</text><g fill="var(--link)" font-size="14"><text x="40" y="182">Overview</text><text x="40" y="212">History</text><text x="40" y="242">Design</text><text x="40" y="272">References</text></g><rect x="950" y="28" width="190" height="34" rx="4" fill="var(--paper)" stroke="var(--rule)"/><text x="970" y="50" font-size="14" fill="var(--muted)">Search articles</text><text class="serif" x="214" y="128" font-size="46" fill="var(--ink)">The World Wide Web</text><path d="M214 148h906" stroke="var(--rule)"/><text x="214" y="182" font-size="14" fill="var(--muted)">Article · Talk</text><g fill="var(--ink)" font-size="17"><text x="214" y="228">The web is an information system that lets documents and other resources</text><text x="214" y="256">be accessed over the Internet. Its visual language has changed, but some</text><text x="214" y="284">page structures remain immediately familiar to readers.</text></g><text class="serif" x="214" y="350" font-size="30" fill="var(--ink)">History</text><path d="M214 362h560" stroke="var(--rule)"/><g fill="var(--ink)" font-size="17"><text x="214" y="402">Early websites placed documents, references, and navigation in simple</text><text x="214" y="430">hierarchies. This reconstruction uses synthetic prose throughout.</text></g><rect x="804" y="200" width="300" height="360" fill="oklch(97% .008 100)" stroke="var(--rule)"/><rect x="824" y="220" width="260" height="130" fill="oklch(86% .02 240)"/><text class="serif" x="856" y="390" font-size="23" fill="var(--ink)">At a glance</text><g font-size="14"><text x="830" y="426" fill="var(--muted)">Type</text><text x="940" y="426" fill="var(--ink)">Information system</text><text x="830" y="458" fill="var(--muted)">Invented</text><text x="940" y="458" fill="var(--ink)">1989</text><text x="830" y="490" fill="var(--muted)">Status</text><text x="940" y="490" fill="var(--link)">Active</text></g></svg>
