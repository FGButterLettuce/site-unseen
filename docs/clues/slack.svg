<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>:root{--paper:oklch(99% .003 300);--ink:oklch(25% .02 300);--muted:oklch(52% .015 300);--rule:oklch(88% .01 300);--sidebar:oklch(32% .1 320);--sideink:oklch(96% .01 320);--green:oklch(64% .17 150);--yellow:oklch(82% .17 90);--blue:oklch(58% .16 235);--red:oklch(62% .2 20)}text{font-family:Arial,sans-serif}</style><rect width="1200" height="720" fill="var(--paper)"/><rect width="1200" height="54" fill="oklch(27% .08 320)"/><circle cx="24" cy="27" r="5" fill="var(--green)"/><circle cx="40" cy="27" r="5" fill="var(--yellow)"/><circle cx="56" cy="27" r="5" fill="var(--red)"/><rect x="410" y="12" width="380" height="31" rx="6" fill="oklch(42% .07 320)"/><text x="548" y="33" font-size="13" fill="var(--sideink)">Search workspace</text><rect y="54" width="280" height="666" fill="var(--sidebar)"/><text x="24" y="96" font-size="20" font-weight="700" fill="var(--sideink)">Pixel Club</text><circle cx="24" cy="132" r="5" fill="var(--green)"/><text x="40" y="137" font-size="14" fill="var(--sideink)">Guest player</text><g fill="var(--sideink)" font-size="15"><text x="24" y="188">Threads</text><text x="24" y="222">Drafts &amp; sent</text><text x="24" y="276" opacity=".7">Channels</text><text x="24" y="310"># general</text><text x="24" y="344"># website-game</text><text x="24" y="378"># random</text><text x="24" y="432" opacity=".7">Direct messages</text><text x="24" y="466">● Maya</text><text x="24" y="500">○ Sam</text></g><rect x="12" y="322" width="256" height="40" rx="6" fill="oklch(44% .1 320)"/><rect x="280" y="54" width="920" height="76" fill="var(--paper)" stroke="var(--rule)"/><text x="312" y="90" font-size="19" font-weight="700" fill="var(--ink)"># website-game</text><text x="312" y="115" font-size="13" fill="var(--muted)">A tiny place for tiny screenshots.</text><g transform="translate(320 168)"><circle cx="24" cy="24" r="22" fill="var(--blue)"/><text x="62" y="18" font-size="1